name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make all
      - name: Verify deterministic synthetic source artifacts
        run: git diff --exit-code -- data/synthetic
      - run: make analytics-install
      - run: make warehouse
